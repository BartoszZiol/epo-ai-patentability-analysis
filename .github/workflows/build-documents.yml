name: Generuj dokumenty analizy prawnej

on:
  workflow_dispatch:
  push:
    paths:
      - analiza-prawna-ai-epo.md
      - .github/workflows/build-documents.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Zainstaluj narzędzia do dokumentów
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer fonts-dejavu-core
      - name: Utwórz Word i PDF
        run: |
          pandoc analiza-prawna-ai-epo.md --from=gfm+footnotes --to=docx --standalone -o Analiza_patentowalnosci_oprogramowania_i_AI_EPO.docx
          mkdir -p /tmp/lo-convert
          libreoffice -env:UserInstallation=file:///tmp/lo-convert --headless --convert-to pdf --outdir . Analiza_patentowalnosci_oprogramowania_i_AI_EPO.docx
          test -s Analiza_patentowalnosci_oprogramowania_i_AI_EPO.docx
          test -s Analiza_patentowalnosci_oprogramowania_i_AI_EPO.pdf
      - name: Zapisz dokumenty w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Analiza_patentowalnosci_oprogramowania_i_AI_EPO.docx Analiza_patentowalnosci_oprogramowania_i_AI_EPO.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Wygeneruj PDF i Word memorandum"
            git push
          fi
